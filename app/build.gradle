plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zunu.noryl'
    compileSdk 34

    defaultConfig {
        applicationId 'com.zunu.noryl'
        minSdk 24          // Android 7.0 ou mais novo
        targetSdk 34
        versionCode 1
        versionName '0.1-teste'
    }

    buildTypes {
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Não comprimir os arquivos do jogo (o vídeo toca direto de dentro do APK)
    androidResources {
        noCompress 'mp4', 'png', 'jpg'
    }
}
