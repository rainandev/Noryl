<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#000000">
  <title>NORYL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,300;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Palco fixo de 1920x1080: tudo fica no tamanho e na posição exatos das artes -->
  <main id="stage">

    <!-- ===== TELA 0: toque para iniciar (libera o som) ===== -->
    <section class="tela" id="tela-inicio">
      <p class="aviso piscando">TOQUE PARA INICIAR</p>
    </section>

    <!-- ===== TELA 1: vídeo de apresentação ===== -->
    <section class="tela escondida" id="tela-intro">
      <video id="intro-video" src="img/intro.mp4" playsinline webkit-playsinline x5-playsinline disablepictureinpicture disableremoteplayback preload="auto"></video>
      <button id="pular" type="button">PULAR ›</button>
    </section>

    <!-- ===== TELA 2: título e menu ===== -->
    <section class="tela escondida" id="tela-menu">
      <!-- Cena em vídeo: entrada, espera do toque e transição (com os sons dos efeitos) -->
      <video id="cena" class="video-cena" src="img/cena.mp4" playsinline webkit-playsinline x5-playsinline disablepictureinpicture disableremoteplayback preload="auto"></video>

      <!-- Fundo do menu em loop: dois vídeos se revezando para não piscar na emenda -->
      <video id="loop-a" class="video-cena loop" src="img/menu-loop.mp4" playsinline webkit-playsinline x5-playsinline disablepictureinpicture disableremoteplayback preload="auto"></video>
      <video id="loop-b" class="video-cena loop" src="img/menu-loop.mp4" playsinline webkit-playsinline x5-playsinline disablepictureinpicture disableremoteplayback preload="auto"></video>

      <!-- 6. Menu: cada linha tem a versão normal, a pincelada e a versão em negrito -->
      <div class="layer linha" id="linha-newgame">
        <div class="layer pincel"><img src="img/pincel.png" alt=""></div>
        <div class="layer normal"><img src="img/menu.png" alt=""></div>
        <div class="layer negrito"><img src="img/bold-newgame.png" alt=""></div>
      </div>
      <div class="layer linha" id="linha-continue">
        <div class="layer pincel"><img src="img/pincel.png" alt=""></div>
        <div class="layer normal"><img src="img/menu.png" alt=""></div>
        <div class="layer negrito"><img src="img/bold-continue.png" alt=""></div>
      </div>
      <div class="layer linha" id="linha-settings">
        <div class="layer pincel"><img src="img/pincel.png" alt=""></div>
        <div class="layer normal"><img src="img/menu.png" alt=""></div>
        <div class="layer negrito"><img src="img/bold-settings.png" alt=""></div>
      </div>
      <div class="layer linha" id="linha-exit">
        <div class="layer pincel"><img src="img/pincel.png" alt=""></div>
        <div class="layer normal"><img src="img/menu.png" alt=""></div>
        <div class="layer negrito"><img src="img/bold-exit.png" alt=""></div>
      </div>

      <!-- Áreas de toque invisíveis em cima de cada opção -->
      <button class="toque-opcao" data-item="newgame"  style="top: 462px" aria-label="New Game"></button>
      <button class="toque-opcao" data-item="continue" style="top: 582px" aria-label="Continue"></button>
      <button class="toque-opcao" data-item="settings" style="top: 701px" aria-label="Settings"></button>
      <button class="toque-opcao" data-item="exit"     style="top: 820px" aria-label="Exit"></button>
    </section>

    <!-- ===== Telas provisórias de cada opção ===== -->
    <section class="tela escondida" id="tela-provisoria">
      <p class="aviso" id="provisoria-texto"></p>
      <p class="aviso pequeno">toque para voltar ao menu</p>
    </section>

    <!-- Cortina preta para as transições entre telas -->
    <div id="cortina"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
